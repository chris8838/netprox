name: CI

on:
  push:
      branches: [ master, dev]
  pull_request_target:
    branches: [ master, dev]

jobs:
  tox:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: tox-logs
          retention-days: 30
          path: |
            .tox
            .coverage
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.3
      - name: Run dev tests with pytest
        run: |
          poetry install -v --only dev,testing
          poetry run pytest -v --cov
      - name: Run main tests with pytest
        run: |
          poetry install -v --only main,testing
          poetry run pytest -v --cov
      - name: linting with Ruff
        run: |
          poetry install -v --only dev
          poetry run ruff check .
  build:
    needs:
      - tox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag netprox:$(date "+%Y-%m-%d-%H-%M")