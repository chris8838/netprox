[tool.pylint.format]
max-line-length = "79"

[tool.ruff]
# Set the maximum line length to 79.
line-length = 79
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
]
ignore = [
    "E501",
    ]


[tool.poetry]
name = "netprox"
version = "0.1.0"
description = "Netbox and Proxmox integration"
authors = ["Christopher Hoffmann <the.chris@zalando.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pynetbox = "^7.4.1"
proxmoxer = "^2.2.0"
flask = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pynetbox = ">=7.4.1"
proxmoxer = ">=2.0.1"
flask = ">=2.2.5"
gunicorn = ">=20.1.0"
requests = ">=2.27.1"

[tool.poetry.group.testing.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
ruff = "^0.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
