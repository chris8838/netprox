[tox]
isolated_build = true
envlist = lint, py311

[gh-actions]
python =
    3.11: py311
    3.11: lint

[testenv]
description = "Run tests with pytest"
recreate=true
allowlist_externals = poetry
passenv = *
commands =

    poetry install -v --only dev,testing
    poetry run pytest -v --cov

    poetry install -v --only main,testing
    poetry run pytest -v --cov

[testenv:lint]
description = "Run linting with Ruff"
commands=
    poetry install -v --only dev,testing
    poetry run ruff check .
